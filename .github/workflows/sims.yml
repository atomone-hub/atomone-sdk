name: Sims
# Sims workflow runs multiple types of simulations (nondeterminism, import-export, after-import, multi-seed-short)
# This workflow will run on all Pull Requests, if a .go, .mod or .sum file have been changed
on:
  schedule:
    - cron: "0 */2 * * *"
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}-sims
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-sims')"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - run: make build
      - name: Install runsim
        run: go install github.com/cosmos/tools/cmd/runsim@v1.0.0
      - uses: actions/cache@v3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary

  test-sim-import-export:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - uses: actions/cache@v3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary
      - name: test-sim-import-export
        run: |
          make test-sim-import-export
      # runsim only prints "halting simulations" and keeps the failure output
      # in per-seed files, which are lost with the runner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-sim-import-export-logs
          path: /tmp/sim-logs-*
          retention-days: 7
          if-no-files-found: ignore

  test-sim-after-import:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - uses: actions/cache@v3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary
      - name: test-sim-after-import
        run: |
          make test-sim-after-import
      # runsim only prints "halting simulations" and keeps the failure output
      # in per-seed files, which are lost with the runner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-sim-after-import-logs
          path: /tmp/sim-logs-*
          retention-days: 7
          if-no-files-found: ignore

  test-sim-multi-seed-short:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - uses: actions/cache@v3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary
      - name: test-sim-multi-seed-short
        run: |
          make test-sim-multi-seed-short
      # runsim only prints "halting simulations" and keeps the failure output
      # in per-seed files, which are lost with the runner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-sim-multi-seed-short-logs
          path: /tmp/sim-logs-*
          retention-days: 7
          if-no-files-found: ignore

  # Scheduled runs have no PR to carry a failing check, so report them as an
  # issue: opened on the first failure, closed once all sims pass again.
  report:
    runs-on: ubuntu-latest
    needs: [build, test-sim-import-export, test-sim-after-import, test-sim-multi-seed-short]
    if: always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped'))
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled simulations are failing
    steps:
      - name: Open or close the failure issue
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            if [ -z "$open" ]; then
              gh issue create --title "$TITLE" --body "First failing run: $RUN_URL (the per-seed sim logs are attached to the run as artifacts for 7 days)"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All simulations passed again: $RUN_URL"
          fi
