name: Buf-Push
# Protobuf runs buf (https://buf.build/) push updated proto files to https://buf.build/cosmos/cosmos-sdk
# This workflow is only run when a .proto file has been changed
on:
  push:
    branches:
      - main
    paths:
      - "proto/**"

jobs:
  push:
    # Pushes to the cosmos BSR module, which we can't publish to. To enable it,
    # rename the module in proto/buf.yaml and add a BUF_TOKEN secret.
    if: github.repository == 'cosmos/cosmos-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: bufbuild/buf-setup-action@v1.21.0
      - uses: bufbuild/buf-push-action@v1
        with:
          input: "proto"
          buf_token: ${{ secrets.BUF_TOKEN }}
